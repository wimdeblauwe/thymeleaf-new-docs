<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Products</title>
</head>
<body>
  <div th:replace="~{components/ui :: alert('info', 'Delivery is free this week.')}"></div>

  <div th:each="product : ${products}">
    <article th:replace="~{components/ui :: product-card(${product})}"></article>
  </div>

  <div th:replace="~{components/ui :: panel('Opening hours', ~{:: #hours}, _)}">
    <ul id="hours">
      <li>Monday to Saturday, 8:00 to 20:00</li>
    </ul>
  </div>

  <div th:replace="~{components/ui :: panel('Newsletter', ~{:: #newsletter}, ~{})}">
    <p id="newsletter">Sign up at the till.</p>
  </div>
</body>
</html>
