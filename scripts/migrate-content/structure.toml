# Maps the converted sources onto the docs navigation (specifications/04-docs-structure.html).
# migrate.py builds every page from this file, and fails if a source line lands on no page
# or on several pages.
#
# A piece is "doc#heading-id", where the id is the anchor on the published page, or "doc" for
# a whole document. Use a table for more control:
#
#   section       the same "doc#heading-id" string
#   intro         true: only the text before the first subheading
#   from, until   start or stop at the first line containing this text
#   exclude       heading ids to leave out
#   cuts          [from, until] text pairs to leave out
#   heading       add this H2 above the piece (text added on purpose)
#   keep_heading  keep or drop the piece's own heading. By default the first piece on a page
#                 drops it, because it's the page title, and later pieces keep it.
#   text          no source: add this text. "page:dir/slug#anchor" links to a page here.
#
# Set manual = true on a page once it's edited by hand. The script then leaves its file alone,
# and it no longer tracks upstream changes to that page.

# Chapter headings with no text of their own: all their sections went elsewhere.
retired = [
  "usingthymeleaf#introducing-thymeleaf",
  "usingthymeleaf#using-texts",
  "usingthymeleaf#template-layout",
  "thymeleafspring#advanced-integration-features",
]

